[pytest]
# A plain `pytest` runs everything that can run here and skips the rest with
# a reason (see tests/conftest.py):
#
#   no database           unit tests run, `db` and `real_data` tests skip
#   empty schema (CI)     `db` tests run too, `real_data` tests skip
#   production database   everything runs
#
# `slow` tests aggregate a whole country. Against the production database
# (about 16 million observations) that takes minutes, because the API's
# summary cache starts cold in every test run, so they are excluded by
# default. Run them before changing api.py: the sitemap endpoint once
# shipped a 504 that only they would have caught.
#
#     pytest -m slow     only the slow tests
#     pytest -m ""       everything
markers =
    db: needs PostgreSQL with schema/schema.sql loaded
    real_data: needs real observations in delay_observations
    slow: aggregates a whole country; minutes against the production database

# The application modules import each other by bare name (from config import
# ...), so the tests need backend/ on the import path, as the services have
# it via their working directory.
pythonpath = backend

addopts = -m "not slow"
