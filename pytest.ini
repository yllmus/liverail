[pytest]
# The default run is the inner loop: every pure-function test, no whole-country
# aggregates. It should finish in well under a second.
#
# The tests marked `slow` query the real train_delay_db, which holds ~15.8M
# delay_observations. They are not slow because of anything they do wrong -
# they exercise endpoints that legitimately aggregate an entire country
# (/sitemap.xml warms all four; /operators/summary and /routes/summary scan one
# each), and api.py's _SUMMARY_CACHE lives in-process, so a fresh pytest run
# always pays the cold price. On this box that is minutes.
#
# They are excluded by default, NOT deleted, and they still matter: the sitemap
# endpoint has already regressed once with a 504. Run them deliberately
# before committing anything that touches api.py:
#
#     pytest tests/ -m slow     the expensive DB tests only
#     pytest tests/ -m ""       everything, the pre-2026-08-22 behaviour
#
# The real fix is a seeded test database rather than the live one - see
# docs/testing.md. This marker split is the cheap interim.
markers =
    slow: hits a whole-country aggregate against the real 15.8M-row database

# The application modules import each other by bare name (from config import
# ...), so the tests need backend/ on the import path, as the services have
# it via their working directory.
pythonpath = backend

addopts = -m "not slow"
