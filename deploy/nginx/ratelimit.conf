# Rate limit zones (defined in http context via conf.d)

limit_req_status 429;

# trainapi_general: 120 req/min per IP - generous for a real browsing/live-
# refreshing user, blocks scraping/bot spikes from a social/SEO traffic
# surge taking the box down (single t2.micro, no autoscaling).
limit_req_zone $binary_remote_addr zone=trainapi_general:10m rate=120r/m;
