# Rate limit zones, loaded in the http context via conf.d.
limit_req_status 429;

# trainapi_general: 120 requests/min per IP. Generous for a real user who is
# browsing and auto-refreshing the live view, and enough to stop a scraper or a
# traffic spike from taking down a single small server.
limit_req_zone $binary_remote_addr zone=trainapi_general:10m rate=120r/m;
